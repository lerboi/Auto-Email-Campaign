<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   {{EMAIL_TITLE}}
  </title>
  <style>
   /* RESET STYLES */
   body { margin: 0; padding: 0; min-width: 100%; width: 100% !important; height: 100% !important; }
   body, table, td, div, p, a { -webkit-font-smoothing: antialiased; text-size-adjust: 100%; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; line-height: 100%; }
   table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; border-spacing: 0; }
   img { border: 0; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
   /* GENERAL TYPOGRAPHY */
   body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f4; color: #333333; }
   /* MOBILE STYLES */
   @media screen and (max-width: 600px) {
    .email-container { width: 100% !important; margin: auto !important; }
    .fluid-img { width: 100% !important; max-width: 100% !important; height: auto !important; }
    .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
    .header-text { font-size: 26px !important; line-height: 32px !important; }
    .body-text { font-size: 16px !important; line-height: 24px !important; }
    .button { width: 100% !important; display: block !important; }
   }
   /* DARK MODE SUPPORT */
   @media (prefers-color-scheme: dark) {
    body { background-color: #1a1a1a !important; color: #ffffff !important; }
    .email-bg { background-color: #1a1a1a !important; }
    .content-bg { background-color: #2d2d2d !important; color: #ffffff !important; }
    h1, h2, h3, p, .text-adaptive { color: #ffffff !important; }
    .force-dark-text { color: #003366 !important; }
    .force-dark-title { color: #166534 !important; }
   }
   /* OUTLOOK DARK MODE FIX */
   [data-ogsc] .content-bg { background-color: #2d2d2d !important; color: #ffffff !important; }
   [data-ogsc] .text-adaptive { color: #ffffff !important; }
  </style>
 </head>
 <body style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #f4f4f4;" width="100%">
  <!-- PREHEADER: {{PREHEADER_TEXT}} -->
  <div style="display:none; font-size:1px; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden; mso-hide:all; font-family: sans-serif;">
   {{PREHEADER_TEXT}}
  </div>
  <center class="email-bg" style="width: 100%; background-color: #f4f4f4;">
   <table align="center" border="0" cellpadding="0" cellspacing="0" class="email-container" role="presentation" style="margin: auto; border-top: 4px solid #D42426;" width="600">
    <!-- LOGO -->
    <tr>
     <td style="padding: 20px 0; text-align: center;">
      <a href="https://www.anione.me">
       <img alt="Anione Logo" height="64" src="https://www.anione.me/circle_icon.ico" style="display: block; margin: 0 auto; border: 0; border-radius: 50%;" width="64"/>
      </a>
     </td>
    </tr>
    <!-- HERO IMAGE -->
    <tr>
     <td class="content-bg" style="background-color: #ffffff; padding: 0;">
      <a href="https://www.anione.me/en/Pricing?voucher={{MULTIPLIER_CODE}}">
       <img alt="{{MONTH_NAME}} Token Surge" class="fluid-img" height="400" src="{{HERO_IMAGE_URL}}" style="width: 100%; max-width: 600px; height: auto; display: block;" width="600"/>
      </a>
     </td>
    </tr>
    <!-- BODY CONTENT -->
    <tr>
     <td class="content-bg mobile-padding" style="background-color: #ffffff; padding: 40px 30px;">
      <!-- HEADING -->
      <h1 class="header-text" style="margin: 0 0 20px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 28px; line-height: 36px; color: #333333; font-weight: bold; text-align: center;">
       {{HEADING}}
      </h1>
      <!-- BODY COPY -->
      <p class="body-text" style="margin: 0 0 25px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #555555; text-align: left;">
       Hi there,
       <br/>
       <br/>
       {{BODY_PARAGRAPH_1}}
       <br/>
       <br/>
       {{BODY_PARAGRAPH_2}}
      </p>
      <!-- RED/PINK DASHED OFFER BOX -->
      <table border="0" cellpadding="0" cellspacing="0" style="background-color: #fdf2f2; border-radius: 8px; border: 2px dashed #D42426;" width="100%">
       <tr>
        <td style="padding: 20px;">
         <p class="force-dark-title" style="margin: 0 0 10px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; color: #D42426; text-align: center;">
          {{BOX_TITLE}}
         </p>
         <p class="force-dark-text" style="margin: 0 0 15px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; color: #333333; text-align: center;">
          {{BOX_DESCRIPTION}}
         </p>
         <!-- CODE DISPLAY -->
         <div style="text-align: center;">
          <div style="background-color: #ffffff; display: inline-block; padding: 5px 15px; border: 1px dashed #D42426; font-family: monospace; font-size: 18px; font-weight: bold; color: #333333; margin-bottom: 15px;">
           CODE: {{MULTIPLIER_CODE}}
          </div>
          <br/>
          <!-- CTA BUTTON -->
          <a href="https://www.anione.me/en/Pricing?voucher={{MULTIPLIER_CODE}}" style="display: inline-block; background-color: #D42426; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; text-decoration: none; padding: 12px 25px; border-radius: 4px;">
           {{CTA_BUTTON_TEXT}}
          </a>
         </div>
        </td>
       </tr>
      </table>
      <br/>
      <br/>
      <!-- CLOSING LINE -->
      <p class="body-text text-adaptive" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; color: #999999; text-align: center;">
       <em>
        {{CLOSING_LINE}}
       </em>
      </p>
     </td>
    </tr>
    <!-- FOOTER -->
    <tr>
     <td style="padding: 30px 20px; text-align: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; color: #999999;">
      <p style="margin: 0;">
       &copy; {{YEAR}} Anione. All rights reserved.
      </p>
      <p style="margin: 10px 0 0 0;">
       <a href="{{{ pm:unsubscribe }}}" style="color: #999999; text-decoration: underline;">
        Unsubscribe
       </a>
      </p>
     </td>
    </tr>
   </table>
  </center>
 </body>
</html>
